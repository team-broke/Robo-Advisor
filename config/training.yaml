# #22/#23에서 조정할 초기값이며 최종 탐색 결과가 아니다.
seed: 42
device: auto
total_timesteps: 1000000
n_envs: 8
vec_env: subproc
ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 1024
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch:
    pi: [256, 256]
    vf: [256, 256]
env:
  lookback: 20
  reward_variant: return
  penalty_lambda: 1.0
  # mdd_limit, commission_rate, slippage_rate 생략 시 공통 설정을 사용한다.
data:
  # dataset_dir 생략 시 공통 data_processed_dir를 사용한다. 상대 경로는 현재 디렉터리 기준.
  train_start: null
  train_end: null  # 필수: 실제 학습 컷오프를 시간대 포함 ISO 시각으로 지정한다.
checkpoint:
  save_freq: 100000  # 전체 환경의 합산 스텝 기준이며 벡터 호출 단위로 올림한다.
# 학습 컷오프 안의 마지막 일부를 검증용으로 떼어 최적 모델(best_model.zip)을 고른다.
# 학습 환경은 start 이전 행만 쓴다. 사용하려면 주석을 풀고 start를 train_end 이전으로 지정한다.
# validation:
#   start: 2023-01-01T00:00:00+09:00
#   eval_freq: 50000  # 전체 환경 합산 스텝 기준
#   metric: sharpe
#   higher_is_better: true
