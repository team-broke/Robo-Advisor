[project]
name = "robo-advisor"
version = "0.1.0"
description = "강화학습 동적 자산배분과 LLM 에이전틱 리서치를 결합한 통합 로보어드바이저"
requires-python = ">=3.10"

# 아래는 직접 의존성의 제약 조건이다.
# 전이 의존성까지 포함한 전체 고정 버전은 requirements.txt 에 있다.
# stable-baselines3 / shap / langchain 은 호환성 이슈가 잦아 명세에 따라 범위를 고정한다.
dependencies = [
    "stable-baselines3==2.3.0",
    "shap==0.45.0",
    "langchain>=0.2.0,<0.3.0",
    "gymnasium",
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
    "yfinance",
    "langchain-core",
    "langchain-community",
    "langgraph",
    "chromadb",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "streamlit",
    "plotly",
    "matplotlib",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "pip-tools",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# flake8 은 pyproject.toml 을 읽지 못한다. 설정은 .flake8 에 있다.
