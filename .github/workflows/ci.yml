name: CI

on:
  push:
    branches: [main, develop]
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 린트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 개발 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: black
        run: black --check --diff src tests dashboard

      - name: flake8
        run: flake8 src tests dashboard

  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 런타임·개발 의존성 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 패키지 설치
        run: pip install --no-deps -e .

      - name: 고정 버전 정합성 확인
        run: pip check

      # 기존 필수 체크 "테스트" 안에서 실행하므로 누수 실패도 병합을 차단한다.
      # pytest는 선택된 테스트가 없어도 종료 코드 5로 실패한다.
      - name: 누수 검증
        run: pytest -q -m leakage --strict-markers

      - name: pytest
        run: pytest -q --cov=robo_advisor --cov-report=term-missing
